# Runs the full test suite (library, studies' reference numbers, headless app) on every push and pull request.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"  # the version the app is deployed with
          cache: pip
      - name: Install pinned dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -q
